<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kwoon</title>
    <meta name="description" content="Kwoon — a moonlit home for your documents. View, edit, annotate, sign and organise PDFs." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Kwoon" />
    <meta property="og:title" content="Kwoon" />
    <meta property="og:description" content="A moonlit home for your documents. View, edit, annotate, sign and organise PDFs." />
    <meta property="og:url" content="https://kwoon.pages.dev/" />
    <meta property="og:image" content="https://kwoon.pages.dev/og-image.png" />
    <meta property="og:image:width" content="1280" />
    <meta property="og:image:height" content="800" />
    <meta property="og:image:alt" content="Kwoon: a crescent moon with a K page, and the tagline A moonlit home for your documents" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://kwoon.pages.dev/og-image.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#0E0F11" />
    <script>
      // Apply the saved theme before first paint (dark is the default).
      try {
        var mode = localStorage.getItem('kw-theme')
        if (mode === 'light') document.documentElement.setAttribute('data-theme', 'light')
        else if (mode === 'system') document.documentElement.removeAttribute('data-theme')
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

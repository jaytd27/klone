<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kwoon</title>
    <meta name="description" content="Kwoon — a PDF editor that runs in your browser. Your files stay on your device." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#0E0F11" />
    <script>
      // Apply the saved theme before first paint (dark is the default).
      try {
        var mode = localStorage.getItem('kw-theme')
        if (mode === 'light') document.documentElement.setAttribute('data-theme', 'light')
        else if (mode === 'system') document.documentElement.removeAttribute('data-theme')
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
